name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One job failing must not cancel the others: each one is a separate
      # operating system and Python version.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04, and actions/python-versions has no
          # build of 3.9 for it.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          # 3.9 on Linux runs on the newest image that still has a build.
          - os: ubuntu-24.04
            python-version: "3.9"
          # actions/python-versions has no arm64 macOS build of 3.9, and
          # macos-latest is arm64, so 3.9 runs as x64 there.
          - os: macos-latest
            python-version: "3.9"
            architecture: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
